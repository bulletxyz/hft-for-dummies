#cloud-config
# Runs once, at the server's first boot.

packages:
  - gcc      # Rust needs a C linker
  - rsync    # deploy.sh copies the code with it

write_files:
  # The bot as a service: started and stopped by deploy.sh, logs in journald.
  - path: /etc/systemd/system/hft-bot.service
    content: |
      [Unit]
      Description=hft-for-dummies market maker
      After=network-online.target

      [Service]
      User=ec2-user
      WorkingDirectory=/home/ec2-user/hft
      # Which config to run; `deploy.sh bench` switches it for a benchmark.
      Environment=CONFIG=bot.toml
      EnvironmentFile=-/home/ec2-user/hft-config
      # The trading key is kept in SSM Parameter Store, never on disk here:
      # each start fetches it into /run (memory), readable by this user only.
      # No key stored (dry run): carry on without it.
      RuntimeDirectory=hft
      RuntimeDirectoryMode=0700
      ExecStartPre=-/bin/sh -c 'aws ssm get-parameter --region ap-northeast-1 --name /hft-for-dummies/bot-key --with-decryption --query Parameter.Value --output text > /run/hft/bot.key && ln -sf /run/hft/bot.key bot.key'
      ExecStart=/home/ec2-user/hft/target/release/hft-for-dummies run ${CONFIG}
      # Ctrl-C, not kill: the bot cancels its orders on the way out.
      KillSignal=SIGINT
      TimeoutStopSec=30

runcmd:
  # Rust for ec2-user; the repo's rust-toolchain.toml picks the version.
  - su - ec2-user -c "curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none"
